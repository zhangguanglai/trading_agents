name: Lint and Test

on:
  pull_request: # run on every PR, not only those targeting main
  push:
    branches: ["main"]
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATABASE_URL: sqlite:///./data/test_tradingagents.db
  TA_APP_SECRET_KEY: ci-test-secret-key-not-for-production

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Run pytest with coverage gate
        # Non-regression coverage gate pinned to the measured baseline.
        # Raise --cov-fail-under as test coverage improves:  40 -> 60 -> 75
        # (pytest-timeout in pyproject addopts fails fast so CI never hangs;
        #  network tests are excluded by default, opt in locally with -m network)
        run: uv run pytest tests/ -q --cov --cov-report=term --cov-fail-under=40 -m "not network"

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  deployment-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify empty-database migration chain
        env:
          DATABASE_URL: sqlite:////tmp/tradingagents-migration-test.db
        run: |
          rm -f /tmp/tradingagents-migration-test.db
          uv run alembic upgrade head
          uv run alembic check
          rm -f /tmp/tradingagents-migration-test.db

      - name: Check operations scripts
        run: |
          uv run python -m py_compile scripts/smoke.py scripts/vps_backup.py scripts/vps_monitor.py
          bash -n scripts/vps_deploy.sh

      - name: Validate production Compose configuration
        run: |
          mkdir -p /tmp/tradingagents-compose
          cp docker-compose.split.yml /tmp/tradingagents-compose/
          cd /tmp/tradingagents-compose
          printf '%s\n' \
            'TA_APP_SECRET_KEY=ci-dummy-secret' \
            'TA_ALLOWED_EMAILS=ci@example.com' \
            'MAIL_HOST=smtp.example.com' > .env
          echo 'IMAGE_REF=ghcr.io/example/tradingagents-ashare@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa' > release.env
          docker compose --env-file .env --env-file release.env -f docker-compose.split.yml config -q
