name: Lint and Test

on:
  pull_request: # run on every PR, not only those targeting main
  push:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  DATABASE_URL: sqlite:///./data/test_tradingagents.db
  TA_APP_SECRET_KEY: ci-test-secret-key-not-for-production

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.x"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Run pytest with coverage gate
        # Non-regression coverage gate pinned to the measured baseline.
        # Raise --cov-fail-under as test coverage improves:  40 -> 60 -> 75
        # (pytest-timeout in pyproject addopts fails fast so CI never hangs;
        #  network tests are excluded by default, opt in locally with -m network)
        run: uv run pytest tests/ -q --cov --cov-report=term --cov-fail-under=40 -m "not network"

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
